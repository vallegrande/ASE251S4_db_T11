# Changelog maestro de SQL Server: lista, EN ORDEN, los archivos de cambios.
# Cada archivo contiene uno o más "changesets" (la unidad que Liquibase aplica y registra).
databaseChangeLog:
  - include:
      file: changelogs/001-baseline.sql
      relativeToChangelogFile: true
  - include:
      file: changelogs/002-order-status-index.sql
      relativeToChangelogFile: true
  - include:
      file: changelogs/003-inventory-is-active.sql
      relativeToChangelogFile: true
  - include:
      file: changelogs/004-seed-demo-data.sql
      relativeToChangelogFile: true
